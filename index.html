<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oferta Rio do Espirito 2027</title>
    
    <!-- Fonte elegante para o título -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="config.js"></script>

    <style>
        /* Fundo escuro geral */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #121214; 
            color: #e1e1e6;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        /* Título Dourado */
        /* Título Dourado Super Premium */
        .titulo-principal {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 6px; /* Espaçamento largo traz muita elegância */
            margin-bottom: 45px;
            
            /* Efeito de Dourado Metálico (Reflexo de luz) */
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            
            /* Sombra escura para destacar o metal do fundo escuro */
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9), 
                         0 0 25px rgba(212, 175, 55, 0.2);
            
            /* Prepara o espaço para a linha decorativa abaixo */
            position: relative;
            padding-bottom: 18px;
        }

        /* Linha decorativa dourada com pontas suaves */
        .titulo-principal::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: linear-gradient(to right, transparent, #d4af37, transparent);
        }

        /* Caixa de conteúdo escura com borda sutil */
        .container { 
            background: #1e1e24; 
            padding: 40px 30px; 
            border-radius: 12px; 
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px rgba(212, 175, 55, 0.05); 
            text-align: center; 
            width: 100%; 
            max-width: 380px; 
        }

        h2 { 
            margin-top: 0; 
            color: #d4af37; 
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .input-group { margin: 20px 0 30px; text-align: center; }
        .input-group label { display: block; margin-bottom: 15px; color: #a8a8b3; font-size: 14px;}
        
        /* Input de valor com visual premium (Apenas linha embaixo) */
        .input-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            transition: 0.3s;
        }
        .input-wrapper:focus-within { border-bottom-color: #d4af37; }
        .input-wrapper span { color: #d4af37; font-size: 24px; font-weight: bold; }
        
        .input-group input { 
            width: 150px; 
            background: transparent;
            border: none;
            color: #fff;
            font-size: 32px; 
            font-weight: bold;
            text-align: left;
            outline: none;
        }

        /* Botões Vazados com Borda Dourada */
        button { 
            width: 100%; 
            padding: 16px; 
            background: transparent; 
            color: #d4af37; 
            border: 1px solid #d4af37; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover { 
            background: rgba(212, 175, 55, 0.1); 
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .btn-secundario { 
            border-color: #444; 
            color: #a8a8b3; 
            margin-top: 15px; 
        }
        .btn-secundario:hover { 
            background: rgba(255, 255, 255, 0.05); 
            border-color: #666;
            color: #fff;
            box-shadow: none;
        }
        
        #tela-2 { display: none; }
        
        /* Fundo branco no QR Code para garantir leitura da câmera */
        #qrcode { 
            margin: 0 auto 30px; 
            display: flex; 
            justify-content: center; 
            background: #fff; 
            padding: 15px; 
            border-radius: 10px; 
            width: fit-content;
        }

        #codigoPixStr { 
            width: 100%; 
            padding: 14px; 
            margin-top: 10px; 
            margin-bottom: 25px; 
            font-size: 13px; 
            color: #888; 
            background: #121214; 
            border: 1px solid #333; 
            border-radius: 8px; 
            box-sizing: border-box; 
            text-align: center;
        }
    </style>
</head>
<body>

<h1 class="titulo-principal">Oferta Rio do Espirito 2027</h1>

<div class="container">
    <!-- TELA 1: Digitar o Valor -->
    <div id="tela-1">
        <h2>Qual valor você deseja ofertar?</h2>
        <div class="input-group">
            <div class="input-wrapper">
                <span>R$</span>
                <input type="number" id="valorPix" placeholder="0,00" step="0.01" min="0.01">
            </div>
        </div>
        <button onclick="avancarParaQrCode()">Gerar Pagamento via Pix</button>
    </div>

    <!-- TELA 2: QR Code e Copia/Cola -->
    <div id="tela-2">
        <h2>Escaneie o código</h2>
        <div id="qrcode"></div>
        
        <label style="font-size: 13px; color: #a8a8b3; display: block; text-align: left; margin-bottom: 8px;">Copia e Cola:</label>
        <input type="text" id="codigoPixStr" readonly>
        
        <button onclick="copiarCodigo()">Copiar Código Pix</button>
        <button class="btn-secundario" onclick="voltar()">Novo Valor</button>
    </div>
</div>

<script>
    let qrCodeApp = null;

    function avancarParaQrCode() {
        const valorInput = document.getElementById('valorPix').value;
        const valor = parseFloat(valorInput);

        if (isNaN(valor) || valor <= 0) {
            alert("Por favor, insira um valor válido.");
            return;
        }

        if (typeof CONFIG_PIX === 'undefined' || CONFIG_PIX.chave === "sua-chave-aqui") {
            alert("A chave Pix não foi configurada no arquivo config.js.");
            return;
        }

        const payloadStr = gerarPayloadPix(CONFIG_PIX.chave, CONFIG_PIX.nome, CONFIG_PIX.cidade, valor);
        document.getElementById('codigoPixStr').value = payloadStr;

        const qrcodeContainer = document.getElementById("qrcode");
        qrcodeContainer.innerHTML = "";
        
        // QR Code gerado em tamanho ideal
        qrCodeApp = new QRCode(qrcodeContainer, { 
            text: payloadStr, 
            width: 220, 
            height: 220,
            colorDark : "#000000",
            colorLight : "#ffffff"
        });

        document.getElementById('tela-1').style.display = 'none';
        document.getElementById('tela-2').style.display = 'block';
    }

    function copiarCodigo() {
        const copyText = document.getElementById("codigoPixStr");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value).then(() => alert("Código Pix copiado com sucesso!"));
    }

    function voltar() {
        document.getElementById('tela-2').style.display = 'none';
        document.getElementById('tela-1').style.display = 'block';
        document.getElementById('valorPix').value = '';
    }

    function gerarPayloadPix(chave, nome, cidade, valor) {
        const formatField = (id, value) => {
            const length = value.length.toString().padStart(2, '0');
            return `${id}${length}${value}`;
        };

        const guiInfo = formatField('00', 'BR.GOV.BCB.PIX');
        const chaveInfo = formatField('01', chave);
        const merchantAccountInfo = formatField('26', guiInfo + chaveInfo);
        
        const merchantCategoryCode = formatField('52', '0000');
        const transactionCurrency = formatField('53', '986');
        const transactionAmount = formatField('54', valor.toFixed(2));
        const countryCode = formatField('58', 'BR');
        const merchantName = formatField('59', nome.substring(0, 25));
        const merchantCity = formatField('60', cidade.substring(0, 15));
        const additionalDataField = formatField('62', formatField('05', '***'));

        let payload = '000201' + merchantAccountInfo + merchantCategoryCode + transactionCurrency + 
                      transactionAmount + countryCode + merchantName + merchantCity + additionalDataField + '6304';
        
        return payload + calcularCrc16(payload);
    }

    function calcularCrc16(payload) {
        let crc = 0xFFFF;
        for (let i = 0; i < payload.length; i++) {
            crc ^= payload.charCodeAt(i) << 8;
            for (let j = 0; j < 8; j++) {
                if ((crc & 0x8000) !== 0) { crc = (crc << 1) ^ 0x1021; } 
                else { crc = crc << 1; }
            }
        }
        return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
    }
</script>
</body>
</html>
